name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step should fail in minutes, not sit on a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Needed to re-encode Ogg/FLAC/WAV sources to MP3 and to sample waveforms.
      # apt on a fresh runner can block behind the machine's own unattended
      # upgrades, so bound the wait rather than letting the job hang on the lock.
      - name: Install ffmpeg
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=180 \
            install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Restore downloaded media
        uses: actions/cache@v4
        with:
          path: .cache
          # Files are keyed by a hash of their URL, so the manifest decides the cache.
          key: media-${{ runner.os }}-${{ hashFiles('content/playlists.json') }}
          restore-keys: |
            media-${{ runner.os }}-

      - run: npm ci

      - name: Fetch tracks listed in content/playlists.json
        run: npm run fetch -- --strict

      - run: npm run typecheck

      # vite.config.ts picks the base path: "/" when public/CNAME names a custom
      # domain, otherwise /<repo>/ from GITHUB_REPOSITORY. Setting BASE_PATH here
      # would override that and break whichever case it does not match.
      - name: Build
        run: npx vite build

      - name: Report output size
        run: |
          du -sh dist
          du -sh dist/songs || true
          echo "base path: $(grep -o 'href="[^"]*assets/[^"]*"' dist/index.html | head -1)"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialise deployments only. Holding this group across the whole workflow
    # meant one slow build queued every later run behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
